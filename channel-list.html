<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>渠道管理 - 权益平台管理系统</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .mk-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .toggle-switch {
      display: flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      cursor: pointer;
      color: #52c41a;
      font-size: 12px;
    }
    .toggle-switch.off {
      color: #8c95a6;
    }
    .mk-input-wrap {
      position: relative;
      width: 100%;
    }
    .mk-input-prefix {
      padding-left: 32px;
    }
    .mk-input-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #8c95a6;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- 顶栏 -->
      <header class="top-header">
        <div class="header-actions">
          <button class="header-icon-btn" title="通知">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </button>
          <div class="header-user">
            <div class="user-avatar" style="width: 24px; height: 24px; font-size: 11px;">A</div>
            <span style="font-size: 13px;">管理员</span>
          </div>
        </div>
      </header>

      <!-- Tab栏 -->
      <div class="tab-bar" id="tab-bar"></div>

      <!-- 页面内容 -->
      <div class="page-content">
        <div class="mk-page">
          <!-- 页头 -->
          <div class="mk-page-header">
            <div>
              <h1 class="mk-page-title">渠道管理</h1>
              <p class="mk-page-subtitle">管理权益投放渠道，支持渠道查询、渠道列表展示，及渠道开启与关闭（对接各个渠道）</p>
            </div>
            <button class="mk-btn mk-btn-primary" onclick="openCreate()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              新增渠道
            </button>
          </div>

          <!-- 统计条 -->
          <div style="display: flex; align-items: center; gap: 24px; margin-bottom: 12px; padding-left: 4px;">
            <span style="font-size: 13px; color: #8c95a6;">渠道总数：<b id="total-count">6</b></span>
            <span style="font-size: 13px; color: #52c41a;">已开启：<b id="enabled-count">5</b></span>
            <span style="font-size: 13px; color: #8c95a6;">已关闭：<b id="disabled-count">1</b></span>
          </div>

          <!-- 查询面板 -->
          <div class="mk-search-panel">
            <div class="mk-search-grid">
              <div class="mk-form-item">
                <label class="mk-label">渠道名称/编码</label>
                <div class="mk-input-wrap">
                  <svg class="mk-input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                  <input class="mk-input mk-input-prefix" placeholder="请输入" id="keyword">
                </div>
              </div>
              <div class="mk-form-item">
                <label class="mk-label">渠道类型</label>
                <select class="mk-select" id="type-filter">
                  <option>全部</option>
                  <option>移动端</option>
                  <option>PC端</option>
                  <option>小程序</option>
                  <option>消息触达</option>
                  <option>线下</option>
                  <option>开放平台</option>
                </select>
              </div>
              <div class="mk-form-item">
                <label class="mk-label">状态</label>
                <select class="mk-select" id="status-filter">
                  <option>全部</option>
                  <option>启用</option>
                  <option>停用</option>
                </select>
              </div>
            </div>
            <div class="mk-search-actions">
              <button class="mk-btn mk-btn-default" onclick="handleReset()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                重置
              </button>
              <button class="mk-btn mk-btn-primary" onclick="handleSearch()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                查询
              </button>
            </div>
          </div>

          <!-- 列表 -->
          <div class="mk-list-panel">
            <div class="mk-list-header">
              <span class="mk-list-title">渠道列表</span>
              <span style="font-size: 13px; color: #8c95a6;">共 <b id="filtered-count">6</b> 条</span>
            </div>
            <div class="overflow-x-auto">
              <table class="mk-table">
                <thead>
                  <tr>
                    <th>渠道编码</th>
                    <th>渠道名称</th>
                    <th>渠道类型</th>
                    <th>关联权益数</th>
                    <th>状态</th>
                    <th>描述</th>
                    <th>创建时间</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="channel-tbody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 开启/关闭确认弹窗 -->
  <div class="mk-modal-overlay" id="toggle-modal" style="display: none;" onclick="closeToggleModal(event)">
    <div class="mk-modal" style="max-width: 400px;" onclick="event.stopPropagation()">
      <div class="mk-modal-header">
        <span id="toggle-modal-title">关闭渠道</span>
        <button class="mk-modal-close" onclick="closeToggleModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="mk-modal-body">
        <p style="font-size: 13px; color: #8c95a6;">确定<span id="toggle-action-text">关闭</span>渠道 <b style="color: #1a1a1a;" id="toggle-channel-name"></b> 吗？</p>
        <p id="toggle-warning" style="font-size: 12px; margin-top: 8px; color: #d46b08;">关闭后该渠道将停止与权益系统的对接，投放至该渠道的权益将不再生效。</p>
      </div>
      <div class="mk-modal-footer">
        <button class="mk-btn mk-btn-default" onclick="closeToggleModal()">取消</button>
        <button class="mk-btn" id="toggle-confirm-btn" onclick="confirmToggle()">确认关闭</button>
      </div>
    </div>
  </div>

  <!-- 新建/编辑弹窗 -->
  <div class="mk-modal-overlay" id="create-modal" style="display: none;" onclick="closeCreateModal(event)">
    <div class="mk-modal" style="max-width: 480px;" onclick="event.stopPropagation()">
      <div class="mk-modal-header">
        <span id="create-modal-title">新增渠道</span>
        <button class="mk-modal-close" onclick="closeCreateModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="mk-modal-body">
        <div style="display: flex; flex-direction: column; gap: 16px;">
          <div class="mk-form-item">
            <label class="mk-label">渠道编码 <span style="color: #ff4d4f;">*</span></label>
            <input class="mk-input" placeholder="例如：APP_MOBILE" id="form-code">
          </div>
          <div class="mk-form-item">
            <label class="mk-label">渠道名称 <span style="color: #ff4d4f;">*</span></label>
            <input class="mk-input" placeholder="请输入渠道名称" id="form-name">
          </div>
          <div class="mk-form-item">
            <label class="mk-label">渠道类型 <span style="color: #ff4d4f;">*</span></label>
            <select class="mk-select" id="form-type">
              <option value="">请选择渠道类型</option>
              <option>移动端</option>
              <option>PC端</option>
              <option>小程序</option>
              <option>消息触达</option>
              <option>线下</option>
              <option>开放平台</option>
            </select>
          </div>
          <div class="mk-form-item">
            <label class="mk-label">渠道描述</label>
            <textarea class="mk-textarea" rows="3" placeholder="请输入渠道描述（选填）" id="form-desc"></textarea>
          </div>
        </div>
      </div>
      <div class="mk-modal-footer">
        <button class="mk-btn mk-btn-default" onclick="closeCreateModal()">取消</button>
        <button class="mk-btn mk-btn-primary" onclick="handleSave()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20,6 9,17 4,12"/></svg>
          保存
        </button>
      </div>
    </div>
  </div>

  <!-- 删除确认弹窗 -->
  <div class="mk-modal-overlay" id="delete-modal" style="display: none;" onclick="closeDeleteModal(event)">
    <div class="mk-modal" style="max-width: 380px;" onclick="event.stopPropagation()">
      <div class="mk-modal-header">
        <span>删除确认</span>
        <button class="mk-modal-close" onclick="closeDeleteModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="mk-modal-body">
        <p style="font-size: 13px; color: #555;">确定删除渠道 <b style="color: #1a1a1a;" id="delete-channel-name"></b> 吗？删除后相关投放规则中的渠道设置将失效。</p>
      </div>
      <div class="mk-modal-footer">
        <button class="mk-btn mk-btn-default" onclick="closeDeleteModal()">取消</button>
        <button class="mk-btn mk-btn-danger" onclick="confirmDelete()">确定删除</button>
      </div>
    </div>
  </div>

  <script src="js/nav.js"></script>
  <script>
    // 渠道数据
    let channels = [
      { id: 'CH001', channelCode: 'APP_MOBILE', channelName: '手机银行APP', channelType: '移动端', status: '启用', description: '手机银行客户端主渠道', createTime: '2024-01-01 09:00:00', equityCount: 24 },
      { id: 'CH002', channelCode: 'WEB_PC', channelName: '网上银行', channelType: 'PC端', status: '启用', description: '个人及企业网上银行系统', createTime: '2024-01-01 09:00:00', equityCount: 18 },
      { id: 'CH003', channelCode: 'MINI_PROG', channelName: '微信小程序', channelType: '小程序', status: '启用', description: '微信生态内嵌小程序', createTime: '2024-02-15 10:00:00', equityCount: 12 },
      { id: 'CH004', channelCode: 'SMS_PUSH', channelName: '短信推送', channelType: '消息触达', status: '启用', description: '短信营销触达渠道', createTime: '2024-03-01 09:00:00', equityCount: 8 },
      { id: 'CH005', channelCode: 'ATM_KIOSK', channelName: 'ATM/自助设备', channelType: '线下', status: '停用', description: 'ATM机和柜台自助终端', createTime: '2024-01-15 09:00:00', equityCount: 3 },
      { id: 'CH006', channelCode: 'PARTNER_API', channelName: '合作方API接口', channelType: '开放平台', status: '启用', description: '对外合作伙伴API接入', createTime: '2024-04-01 09:00:00', equityCount: 6 },
    ];

    let editItem = null;
    let toggleItem = null;
    let deleteItem = null;

    // 更新统计
    function updateStats() {
      const enabled = channels.filter(c => c.status === '启用').length;
      document.getElementById('total-count').textContent = channels.length;
      document.getElementById('enabled-count').textContent = enabled;
      document.getElementById('disabled-count').textContent = channels.length - enabled;
    }

    // 渲染列表
    function renderList() {
      const keyword = document.getElementById('keyword').value;
      const typeFilter = document.getElementById('type-filter').value;
      const statusFilter = document.getElementById('status-filter').value;

      const filtered = channels.filter(c => {
        if (keyword && !c.channelName.includes(keyword) && !c.channelCode.includes(keyword)) return false;
        if (typeFilter !== '全部' && c.channelType !== typeFilter) return false;
        if (statusFilter !== '全部' && c.status !== statusFilter) return false;
        return true;
      });

      document.getElementById('filtered-count').textContent = filtered.length;

      const tbody = document.getElementById('channel-tbody');
      tbody.innerHTML = filtered.map(ch => `
        <tr>
          <td style="font-size: 12px; font-family: monospace; color: #8c95a6;">${ch.channelCode}</td>
          <td style="font-weight: 500;">${ch.channelName}</td>
          <td><span class="mk-badge mk-badge-default">${ch.channelType}</span></td>
          <td>${ch.equityCount}</td>
          <td><span class="${ch.status === '启用' ? 'mk-badge mk-badge-success' : 'mk-badge mk-badge-default'}">${ch.status}</span></td>
          <td style="color: #8c95a6;">${ch.description}</td>
          <td style="color: #8c95a6;">${ch.createTime}</td>
          <td>
            <div style="display: flex; align-items: center; gap: 8px;">
              <button class="${ch.status === '启用' ? 'toggle-switch' : 'toggle-switch off'}" onclick="openToggle('${ch.id}')">
                ${ch.status === '启用'
                  ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="5" width="22" height="14" rx="7" fill="#52c41a"/><circle cx="16" cy="12" r="3" fill="#fff"/></svg>'
                  : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="5" width="22" height="14" rx="7" fill="#d9dee6"/><circle cx="8" cy="12" r="3" fill="#fff"/></svg>'}
                <span>${ch.status === '启用' ? '已开启' : '已关闭'}</span>
              </button>
              <button class="mk-link" onclick="openEdit('${ch.id}')">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 16.5 3 18l1.5-4.5L17 3z"/></svg>
                编辑
              </button>
              <button class="mk-link mk-link-danger" onclick="openDelete('${ch.id}')">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                删除
              </button>
            </div>
          </td>
        </tr>
      `).join('');

      updateStats();
    }

    // 查询
    function handleSearch() {
      renderList();
    }

    // 重置
    function handleReset() {
      document.getElementById('keyword').value = '';
      document.getElementById('type-filter').value = '全部';
      document.getElementById('status-filter').value = '全部';
      renderList();
    }

    // 打开新建
    function openCreate() {
      editItem = null;
      document.getElementById('form-code').value = '';
      document.getElementById('form-name').value = '';
      document.getElementById('form-type').value = '';
      document.getElementById('form-desc').value = '';
      document.getElementById('create-modal-title').textContent = '新增渠道';
      document.getElementById('create-modal').style.display = 'flex';
    }

    // 打开编辑
    function openEdit(id) {
      editItem = channels.find(c => c.id === id);
      if (!editItem) return;
      document.getElementById('form-code').value = editItem.channelCode;
      document.getElementById('form-name').value = editItem.channelName;
      document.getElementById('form-type').value = editItem.channelType;
      document.getElementById('form-desc').value = editItem.description;
      document.getElementById('create-modal-title').textContent = '编辑渠道';
      document.getElementById('create-modal').style.display = 'flex';
    }

    // 关闭新建/编辑弹窗
    function closeCreateModal(e) {
      if (e && e.target !== e.currentTarget) return;
      document.getElementById('create-modal').style.display = 'none';
    }

    // 保存
    function handleSave() {
      const code = document.getElementById('form-code').value;
      const name = document.getElementById('form-name').value;
      const type = document.getElementById('form-type').value;
      const desc = document.getElementById('form-desc').value;

      if (!code || !name || !type) {
        alert('请填写必填项');
        return;
      }

      if (editItem) {
        editItem.channelCode = code;
        editItem.channelName = name;
        editItem.channelType = type;
        editItem.description = desc;
      } else {
        channels.push({
          id: 'CH' + Date.now(),
          channelCode: code,
          channelName: name,
          channelType: type,
          status: '启用',
          description: desc,
          createTime: new Date().toLocaleString('zh-CN'),
          equityCount: 0
        });
      }

      closeCreateModal();
      renderList();
    }

    // 打开开关弹窗
    function openToggle(id) {
      toggleItem = channels.find(c => c.id === id);
      if (!toggleItem) return;
      const isEnable = toggleItem.status === '停用';
      document.getElementById('toggle-modal-title').textContent = isEnable ? '开启渠道' : '关闭渠道';
      document.getElementById('toggle-action-text').textContent = isEnable ? '开启' : '关闭';
      document.getElementById('toggle-channel-name').textContent = toggleItem.channelName;
      document.getElementById('toggle-warning').textContent = isEnable
        ? '开启后该渠道将恢复与权益系统的对接，可重新配置投放规则。'
        : '关闭后该渠道将停止与权益系统的对接，投放至该渠道的权益将不再生效。';
      document.getElementById('toggle-warning').style.color = isEnable ? '#389e0d' : '#d46b08';
      const confirmBtn = document.getElementById('toggle-confirm-btn');
      confirmBtn.textContent = isEnable ? '确认开启' : '确认关闭';
      confirmBtn.className = isEnable ? 'mk-btn mk-btn-primary' : 'mk-btn mk-btn-danger';
      document.getElementById('toggle-modal').style.display = 'flex';
    }

    // 关闭开关弹窗
    function closeToggleModal(e) {
      if (e && e.target !== e.currentTarget) return;
      document.getElementById('toggle-modal').style.display = 'none';
    }

    // 确认开关
    function confirmToggle() {
      if (!toggleItem) return;
      toggleItem.status = toggleItem.status === '启用' ? '停用' : '启用';
      closeToggleModal();
      renderList();
    }

    // 打开删除弹窗
    function openDelete(id) {
      deleteItem = channels.find(c => c.id === id);
      if (!deleteItem) return;
      document.getElementById('delete-channel-name').textContent = deleteItem.channelName;
      document.getElementById('delete-modal').style.display = 'flex';
    }

    // 关闭删除弹窗
    function closeDeleteModal(e) {
      if (e && e.target !== e.currentTarget) return;
      document.getElementById('delete-modal').style.display = 'none';
    }

    // 确认删除
    function confirmDelete() {
      if (!deleteItem) return;
      channels = channels.filter(c => c.id !== deleteItem.id);
      closeDeleteModal();
      renderList();
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
      renderList();
    });
  </script>
</body>
</html>
