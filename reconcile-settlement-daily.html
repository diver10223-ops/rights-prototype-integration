<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日报表明细 - 权益平台管理系统</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- 顶栏 -->
      <header class="top-header">
        <div class="header-actions">
          <button class="header-icon-btn" title="消息">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </button>
          <button class="header-icon-btn" title="设置">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <div class="header-user">
            <div class="user-avatar">A</div>
            <span style="font-size: 13px;">管理员</span>
          </div>
        </div>
      </header>

      <!-- Tab栏 -->
      <div class="tab-bar" id="tab-bar"></div>

      <!-- 页面内容区 -->
      <div class="page-content" style="padding: 0; background: #f5f7fa;">
        <div style="min-height: 100%; background: #f5f7fa;">
          <!-- 页面顶部 -->
          <div style="background: #fff; borderBottom: '1px solid #e8ecf0'; padding: '10px 24px'; display: 'flex'; alignItems: 'center'; gap: 8;">
            <button onclick="goBack()" style="display: flex; alignItems: 'center'; gap: 4; color: #1677ff; background: none; border: none; cursor: pointer; fontSize: 14; padding: 0;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>返回
            </button>
            <span style="color: #d9dee6;">|</span>
            <span style="fontSize: 14; color: '#333'; fontWeight: 500;" id="page-title">日报表明细</span>
            <div style="marginLeft: auto;">
              <button class="mk-btn" style="display: flex; alignItems: 'center'; gap: 6; border: '1px solid #d9dee6'; color: '#555'; height: 32; padding: '0 14px'; fontSize: 13;" onclick="handleDownload()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>下载日报表
              </button>
            </div>
          </div>

          <div style="padding: 24px;">
            <div style="background: #fff; borderRadius: 8; border: '1px solid #e8ecf0'; padding: '20px 24px';">
              <div style="fontWeight: 600; fontSize: 15; marginBottom: 16, color: '#333';">日报表明细</div>
              <div class="overflow-x-auto">
                <table class="mk-table" id="detail-table">
                  <thead>
                    <tr>
                      <th>流水号</th>
                      <th>类型</th>
                      <th>关联流水号</th>
                      <th>结算渠道</th>
                      <th>权益名称</th>
                      <th>操作</th>
                      <th>数量</th>
                      <th>结算金额</th>
                      <th>来源和数量</th>
                      <th>备注</th>
                    </tr>
                  </thead>
                  <tbody id="detail-tbody">
                  </tbody>
                </table>
              </div>

              <!-- 分页 -->
              <div style="display: flex; alignItems: 'center'; justifyContent: 'flex-end'; gap: 10; marginTop: 16;">
                <span style="fontSize: 13; color: '#8c95a6';" id="total-count">共 3 条</span>
                <button class="mk-page-btn" id="prev-btn" onclick="changePage(currentPage - 1)">&lt;</button>
                <div id="page-buttons"></div>
                <button class="mk-page-btn" id="next-btn" onclick="changePage(currentPage + 1)">&gt;</button>
                <span style="fontSize: 13; color: '#8c95a6';">前往</span>
                <input class="mk-input" style="width: 48px; textAlign: center;" id="page-input" value="1" onblur="jumpToPage()">
                <span style="fontSize: 13; color: '#8c95a6';">页　20条/页</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/nav.js"></script>
  <script>
    // Mock数据
    const mockDetails = [
      { id: '1', flowId: '20230929093443000016', type: '正常交易', relatedFlowId: '', channel: 'ORDINARY', equityName: '流程测试5元抵扣券', operation: '使用资产', qty: 1, amount: '¥1.00', source: '规则:1', remark: '' },
      { id: '2', flowId: '20230929093512000025', type: '正常交易', relatedFlowId: '', channel: 'ORDINARY', equityName: '理财加息券10元', operation: '发放资产', qty: 2, amount: '¥20.00', source: '活动:A001', remark: '' },
      { id: '3', flowId: '20230929094001000038', type: '退款交易', relatedFlowId: '20230929093512000025', channel: 'ORDINARY', equityName: '理财加息券10元', operation: '回收资产', qty: 1, amount: '¥10.00', source: '退款:退款单001', remark: '用户申请退款' },
    ];

    const PAGE_SIZE = 20;
    let currentPage = 1;
    let dateParam = '';

    // 获取URL参数
    function getUrlParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name) || '';
    }

    // 返回
    function goBack() {
      window.location.href = 'reconcile-settlement.html';
    }

    // 渲染表格
    function renderTable() {
      const tbody = document.getElementById('detail-tbody');
      const total = mockDetails.length;
      const totalPages = Math.ceil(total / PAGE_SIZE);
      const paged = mockDetails.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

      document.getElementById('total-count').textContent = `共 ${total} 条`;

      if (paged.length === 0) {
        tbody.innerHTML = `<tr><td colspan="10" class="text-center text-muted-foreground" style="padding: 40px;">暂无数据</td></tr>`;
      } else {
        tbody.innerHTML = paged.map(row => `
          <tr>
            <td style="color: #1677ff; wordBreak: 'break-all'; minWidth: 160;">${row.flowId}</td>
            <td>${row.type}</td>
            <td class="text-muted-foreground">${row.relatedFlowId || '--'}</td>
            <td>${row.channel}</td>
            <td style="color: #1677ff;">${row.equityName}</td>
            <td>${row.operation}</td>
            <td>${row.qty}</td>
            <td>${row.amount}</td>
            <td class="text-muted-foreground">${row.source}</td>
            <td class="text-muted-foreground">${row.remark || '--'}</td>
          </tr>
        `).join('');
      }

      // 渲染分页按钮
      const pageButtons = document.getElementById('page-buttons');
      let btnHtml = '';
      for (let p = 1; p <= totalPages; p++) {
        btnHtml += `<button class="mk-page-btn${currentPage === p ? ' active' : ''}" onclick="changePage(${p})">${p}</button>`;
      }
      pageButtons.innerHTML = btnHtml;

      // 更新输入框
      document.getElementById('page-input').value = currentPage;

      // 更新按钮状态
      document.getElementById('prev-btn').disabled = currentPage === 1;
      document.getElementById('next-btn').disabled = currentPage === totalPages || totalPages === 0;
    }

    // 切换页码
    function changePage(page) {
      const totalPages = Math.ceil(mockDetails.length / PAGE_SIZE);
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      renderTable();
    }

    // 跳转页面
    function jumpToPage() {
      const input = document.getElementById('page-input');
      const page = parseInt(input.value);
      const totalPages = Math.ceil(mockDetails.length / PAGE_SIZE);
      if (page >= 1 && page <= totalPages) {
        currentPage = page;
        renderTable();
      }
    }

    // 下载
    function handleDownload() {
      const headers = ['流水号', '类型', '关联流水号', '结算渠道', '权益名称', '操作', '数量', '结算金额', '来源和数量', '备注'];
      const rows = mockDetails.map(r => [r.flowId, r.type, r.relatedFlowId, r.channel, r.equityName, r.operation, r.qty, r.amount, r.source, r.remark]);
      const csv = [headers, ...rows].map(r => r.join(',')).join('\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `日报表明细_${dateParam || ''}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
      dateParam = getUrlParam('date');
      if (dateParam) {
        document.getElementById('page-title').textContent = `日报表明细（${dateParam}）`;
      }
      renderTable();
    });
  </script>
</body>
</html>
