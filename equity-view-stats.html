<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>权益统计视图 - 权益平台管理系统</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .chart-placeholder {
      background: #f8fafc;
      border: 1px dashed #d9dee6;
      border-radius: 6px;
      display: flex;
      alignItems: center;
      justifyContent: center;
      color: #8c95a6;
      fontSize: 13px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- 主内容区 -->
    <div class="main-content">
      <!-- 顶栏 -->
      <header class="top-header">
        <div class="header-actions">
          <button class="header-icon-btn" title="消息">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          </button>
          <div class="header-user">
            <div class="user-avatar">A</div>
            <span style="font-size: 13px;">管理员</span>
          </div>
        </div>
      </header>

      <!-- Tab栏 -->
      <div class="tab-bar" id="tab-bar"></div>

      <!-- 页面内容区 -->
      <div class="page-content">
        <div class="mk-page">
          <!-- 页头 -->
          <div style="display: flex; alignItems: center; gap: 12px; marginBottom: 16px;">
            <button class="mk-btn mk-btn-default" onclick="location.href='equity-list.html'">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
              返回列表
            </button>
            <div>
              <div style="display: flex; alignItems: center; gap: 4px; fontSize: 12px; color: #8c95a6; marginBottom: 2px;">
                <span>权益管理</span><span>›</span><span style="color: #1a1a2e;">权益视图</span>
              </div>
              <h1 style="fontSize: 16px; fontWeight: 600; color: #1a1a2e;">95折优惠券</h1>
            </div>
            <div style="marginLeft: 8px; fontSize: 12px; color: #8c95a6;">ID：1001</div>
            <span class="mk-badge mk-badge-info" style="marginLeft: 8px;">行内自建</span>
          </div>

          <!-- KPI卡片 -->
          <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4">
            <div class="mk-list-panel" style="display: flex; alignItems: center; gap: 12px; padding: 16px;">
              <div style="padding: 8px; borderRadius: 8px; background: #e8f4ff; flexShrink: 0;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1677ff" stroke-width="2">
                  <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                  <polyline points="17 6 23 6 23 12"></polyline>
                </svg>
              </div>
              <div>
                <p style="fontSize: 12px; color: #8c95a6;">已发放量</p>
                <p style="fontSize: 18px; fontWeight: 700; marginTop: 2px; color: #1677ff;">4,100</p>
              </div>
            </div>
            <div class="mk-list-panel" style="display: flex; alignItems: center; gap: 12px; padding: 16px;">
              <div style="padding: 8px; borderRadius: 8px; background: #f0fff4; flexShrink: 0;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#52c41a" stroke-width="2">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </div>
              <div>
                <p style="fontSize: 12px; color: #8c95a6;">已使用量</p>
                <p style="fontSize: 18px; fontWeight: 700; marginTop: 2px; color: #52c41a;">3,842</p>
              </div>
            </div>
            <div class="mk-list-panel" style="display: flex; alignItems: center; gap: 12px; padding: 16px;">
              <div style="padding: 8px; borderRadius: 8px; background: #fffbf0; flexShrink: 0;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f0a500" stroke-width="2">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                  <circle cx="9" cy="7" r="4"></circle>
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
              </div>
              <div>
                <p style="fontSize: 12px; color: #8c95a6;">当前持有量</p>
                <p style="fontSize: 18px; fontWeight: 700; marginTop: 2px; color: #f0a500;">246</p>
              </div>
            </div>
            <div class="mk-list-panel" style="display: flex; alignItems: center; gap: 12px; padding: 16px;">
              <div style="padding: 8px; borderRadius: 8px; background: #fff1f0; flexShrink: 0;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff4d4f" stroke-width="2">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
              </div>
              <div>
                <p style="fontSize: 12px; color: #8c95a6;">已过期量</p>
                <p style="fontSize: 18px; fontWeight: 700; marginTop: 2px; color: #ff4d4f;">12</p>
              </div>
            </div>
            <div class="mk-list-panel" style="display: flex; alignItems: center; gap: 12px; padding: 16px;">
              <div style="padding: 8px; borderRadius: 8px; background: #f9f0ff; flexShrink: 0;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#722ed1" stroke-width="2">
                  <line x1="12" y1="1" x2="12" y2="23"></line>
                  <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
              </div>
              <div>
                <p style="fontSize: 12px; color: #8c95a6;">结算资金</p>
                <p style="fontSize: 18px; fontWeight: 700; marginTop: 2px; color: #722ed1;">¥19,210</p>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <!-- 近7天趋势折线图 -->
            <div class="md:col-span-2 mk-list-panel">
              <div class="mk-list-header">
                <span class="mk-list-title">近7天发放 / 使用趋势</span>
              </div>
              <div style="height: 224px; padding: 20px;">
                <div class="chart-placeholder" style="height: 100%;">
                  <div style="textAlign: center;">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#d9dee6" stroke-width="2" style="marginBottom: 8;">
                      <path d="M3 3v18h18"></path>
                      <path d="M18 17V9"></path>
                      <path d="M13 17V5"></path>
                      <path d="M8 17v-3"></path>
                    </svg>
                    <div>趋势图（需要图表库支持）</div>
                  </div>
                </div>
              </div>
            </div>

            <!-- 使用分布饼图 -->
            <div class="mk-list-panel">
              <div class="mk-list-header">
                <span class="mk-list-title">使用状态分布</span>
              </div>
              <div style="height: 224px; padding: 20px; display: flex; alignItems: center; justifyContent: center;">
                <div style="textAlign: center;">
                  <div style="width: 160px; height: 160px; borderRadius: 50%; background: 'conic-gradient(#52c41a 0% 94%, #f0a500 94% 100%)'; margin: '0 auto 16px'; position: relative;">
                    <div style="position: absolute; top: 30%; left: 30%; right: 30%; bottom: 30%; background: #fff; borderRadius: 50%;"></div>
                  </div>
                  <div style="display: flex; justifyContent: center; gap: 16px; fontSize: 12px;">
                    <span><span style="display: inline-block; width: 12px; height: 12px; borderRadius: 2px; background: #52c41a; marginRight: 4px;"></span>已使用</span>
                    <span><span style="display: inline-block; width: 12px; height: 12px; borderRadius: 2px; background: #f0a500; marginRight: 4px;"></span>持有中</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- 每日发放柱状图 -->
            <div class="md:col-span-2 mk-list-panel">
              <div class="mk-list-header">
                <span class="mk-list-title">每日发放量</span>
              </div>
              <div style="height: 192px; padding: 20px;">
                <div class="chart-placeholder" style="height: 100%;">
                  <div style="textAlign: center;">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#d9dee6" stroke-width="2" style="marginBottom: 8;">
                      <rect x="3" y="12" width="4" height="9" rx="1"></rect>
                      <rect x="10" y="8" width="4" height="13" rx="1"></rect>
                      <rect x="17" y="4" width="4" height="17" rx="1"></rect>
                    </svg>
                    <div>柱状图（需要图表库支持）</div>
                  </div>
                </div>
              </div>
            </div>

            <!-- 权益基本信息 -->
            <div class="mk-list-panel">
              <div class="mk-list-header">
                <span class="mk-list-title">权益基本信息</span>
              </div>
              <div style="display: flex; flexDirection: column; gap: 12px; padding: 20px;">
                <div style="display: flex; alignItems: flex-start; justifyContent: space-between; fontSize: 12px;">
                  <span style="color: #8c95a6; flexShrink: 0; width: 80px;">权益ID</span>
                  <span style="color: #1a1a2e; fontWeight: 500; textAlign: right;">1001</span>
                </div>
                <div style="display: flex; alignItems: flex-start; justifyContent: space-between; fontSize: 12px;">
                  <span style="color: #8c95a6; flexShrink: 0; width: 80px;">权益名称</span>
                  <span style="color: #1a1a2e; fontWeight: 500; textAlign: right;">95折优惠券</span>
                </div>
                <div style="display: flex; alignItems: flex-start; justifyContent: space-between; fontSize: 12px;">
                  <span style="color: #8c95a6; flexShrink: 0; width: 80px;">库存总量</span>
                  <span style="color: #1a1a2e; fontWeight: 500; textAlign: right;">10,000</span>
                </div>
                <div style="display: flex; alignItems: flex-start; justifyContent: space-between; fontSize: 12px;">
                  <span style="color: #8c95a6; flexShrink: 0; width: 80px;">有效期</span>
                  <span style="color: #1a1a2e; fontWeight: 500; textAlign: right;">2026-06-01 ~ 2026-12-31</span>
                </div>
                <div style="display: flex; alignItems: flex-start; justifyContent: space-between; fontSize: 12px;">
                  <span style="color: #8c95a6; flexShrink: 0; width: 80px;">供应商</span>
                  <span style="color: #1a1a2e; fontWeight: 500; textAlign: right;">易诚银行</span>
                </div>
                <div style="display: flex; alignItems: flex-start; justifyContent: space-between; fontSize: 12px;">
                  <span style="color: #8c95a6; flexShrink: 0; width: 80px;">单张成本</span>
                  <span style="color: #1a1a2e; fontWeight: 500; textAlign: right;">¥5.00</span>
                </div>
              </div>
            </div>
          </div>

          <p style="fontSize: 12px; color: #8c95a6; marginTop: 16px; textAlign: right;">
            统计时间：2026-07-20 23:59:59 · 数据来源：实时核销流水
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/nav.js"></script>
</body>
</html>
