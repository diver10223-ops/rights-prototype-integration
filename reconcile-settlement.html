<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>权益成本结算 - 权益平台管理系统</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- 顶栏 -->
      <header class="top-header">
        <div class="header-actions">
          <button class="header-icon-btn" title="消息">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </button>
          <button class="header-icon-btn" title="设置">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <div class="header-user">
            <div class="user-avatar">A</div>
            <span style="font-size: 13px;">管理员</span>
          </div>
        </div>
      </header>

      <!-- Tab栏 -->
      <div class="tab-bar" id="tab-bar"></div>

      <!-- 页面内容区 -->
      <div class="page-content" style="padding: 24px; background: #f5f7fa;">
        <div style="min-height: 100%; background: #f5f7fa;">
          <!-- Tab切换 -->
          <div style="display: flex; gap: 32px; marginBottom: 20; borderBottom: '2px solid #e8ecf0'; background: '#fff'; padding: '0 24px';">
            <div style="display: flex; gap: 32px; borderBottom: '2px solid #e8ecf0'; background: '#fff'; padding: '0 24px';" class="flex">
              <button id="tab-daily" class="mk-tab-item active" onclick="handleTabChange('daily')" style="padding: 14px 0; font-size: 15px; font-weight: 600; color: #1677ff; border-bottom: 2px solid #1677ff; margin-bottom: -1px;">
                日报表
              </button>
              <button id="tab-monthly" class="mk-tab-item" onclick="handleTabChange('monthly')" style="padding: 14px 0; font-size: 15px; font-weight: 600; color: #555; border-bottom: 2px solid transparent; margin-bottom: -1px;">
                月报表
              </button>
            </div>
          </div>

          <!-- 筛选栏 -->
          <div style="background: '#fff'; borderRadius: 8; border: '1px solid #e8ecf0'; padding: '16px 24px'; marginBottom: 16; display: 'flex'; alignItems: 'center'; gap: 24; flexWrap: 'wrap';" class="flex items-center gap-3 mb-4">
            <div class="flex items-center gap-2">
              <span style="fontSize: 13; color: '#555'; whiteSpace: 'nowrap';">所属机构</span>
              <select class="mk-select" style="width: 220px;" id="org">
                <option>请选择所属机构</option>
                <option>易诚银行</option>
                <option>零售银行部</option>
                <option>信用卡中心</option>
              </select>
            </div>
            <div class="flex items-center gap-2">
              <span style="fontSize: 13; color: '#555'; whiteSpace: 'nowrap';">日期</span>
              <div style="display: flex; alignItems: 'center'; border: '1px solid #d9dee6'; borderRadius: 6; padding: '4px 10px'; background: '#fff'; gap: 6;">
                <span style="color: '#aaa'; fontSize: 13;">📅</span>
                <input style="border: none; outline: none; fontSize: 13px; width: 90px; color: #333;" id="dateFrom" value="2021-07-01" onchange="updateDateFrom()">
                <span style="color: '#aaa';">至</span>
                <input style="border: none; outline: none; fontSize: 13px; width: 90px; color: #333;" id="dateTo" value="2026-07-09" onchange="updateDateTo()">
              </div>
            </div>
            <div class="flex items-center gap-2" style="margin-left: auto;">
              <button class="mk-btn mk-btn-primary" style="height: 34px; padding: '0 22px';" onclick="handleQuery()">查询</button>
              <button class="mk-btn" style="height: 34px; padding: '0 22px'; border: '1px solid #d9dee6'; background: '#fff'; color: '#555';" onclick="handleReset()">重置</button>
            </div>
          </div>

          <!-- 表格 -->
          <div style="background: '#fff'; borderRadius: 8; border: '1px solid #e8ecf0'; padding: '20px 24px';">
            <div style="display: flex; alignItems: 'center'; justifyContent: 'space-between'; marginBottom: 16;">
              <span style="fontWeight: 600; fontSize: 15px; color: '#333';" id="table-title">日报表</span>
              <button id="download-btn" class="mk-btn" style="border: '1px solid #1677ff'; color: '#1677ff'; background: '#fff'; display: 'flex'; alignItems: 'center'; gap: 4; height: 32; padding: '0 14px'; fontSize: 13;" onclick="handleDownload()">
                ↓ 下载
              </button>
            </div>
            <div class="overflow-x-auto">
              <table class="mk-table" id="settlement-table">
                <thead>
                  <tr id="table-header">
                    <th>机构名称</th>
                    <th>日期</th>
                    <th>结算笔数</th>
                    <th>结算金额</th>
                    <th>结算状态</th>
                    <th>结算结果</th>
                    <th>规则金额</th>
                    <th>营销活动金额</th>
                    <th>会员权益金额</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="settlement-tbody">
                </tbody>
              </table>
            </div>

            <!-- 分页 -->
            <div id="pagination" style="display: flex; alignItems: 'center'; justifyContent: 'flex-end'; gap: 10; marginTop: 16;">
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/nav.js"></script>
  <script>
    // 状态
    let currentTab = 'daily';
    let currentPage = 1;
    const PAGE_SIZE = 10;

    // 生成日报表数据
    function genDailyRows() {
      const rows = [];
      for (let i = 0; i < 20; i++) {
        const d = new Date('2026-06-24');
        d.setDate(d.getDate() - i);
        const ds = d.toISOString().slice(0, 10).replace(/-/g, '');
        const count = i === 5 ? 3 : 0;
        const amount = count > 0 ? '¥16.00' : '¥0.00';
        const pf = count > 0 ? '¥16.00' : '¥0.00';
        rows.push({
          id: `d${i}`,
          org: '易诚银行',
          date: ds,
          count: count,
          amount: amount,
          status: '已结算',
          result: '成功',
          pointFee: pf,
          marketFee: '¥0.00',
          memberFee: '¥0.00'
        });
      }
      return rows;
    }

    // 生成月报表数据
    function genMonthlyRows() {
      const rows = [];
      const months = ['202605', '202604', '202603', '202602', '202601', '202512', '202511', '202510', '202509', '202508', '202507', '202506'];
      months.forEach((m, i) => {
        const yr = parseInt(m.slice(0, 4));
        const mo = parseInt(m.slice(4, 6));
        const lastDay = new Date(yr, mo, 0).getDate();
        const date = `${yr}${String(mo).padStart(2, '0')}${lastDay}`;
        const count = m === '202601' ? 3 : 0;
        const amount = count > 0 ? '¥16.00' : '¥0.00';
        const pf = count > 0 ? '¥16.00' : '¥0.00';
        rows.push({
          id: `m${i}`,
          org: '易诚银行',
          date: date,
          reportName: `易诚银行${m}`,
          count: count,
          amount: amount,
          status: '已结算',
          result: '成功',
          pointFee: pf,
          marketFee: '¥0.00',
          memberFee: '¥0.00'
        });
      });
      return rows;
    }

    const allDailyRows = genDailyRows();
    const allMonthlyRows = genMonthlyRows();

    // Tab切换
    function handleTabChange(tab) {
      currentTab = tab;
      currentPage = 1;

      // 更新Tab样式
      const tabDaily = document.getElementById('tab-daily');
      const tabMonthly = document.getElementById('tab-monthly');
      if (tab === 'daily') {
        tabDaily.classList.add('active');
        tabDaily.style.color = '#1677ff';
        tabDaily.style.borderBottom = '2px solid #1677ff';
        tabMonthly.classList.remove('active');
        tabMonthly.style.color = '#555';
        tabMonthly.style.borderBottom = '2px solid transparent';
        document.getElementById('dateFrom').value = '2021-07-01';
        document.getElementById('dateTo').value = '2026-07-09';
      } else {
        tabMonthly.classList.add('active');
        tabMonthly.style.color = '#1677ff';
        tabMonthly.style.borderBottom = '2px solid #1677ff';
        tabDaily.classList.remove('active');
        tabDaily.style.color = '#555';
        tabDaily.style.borderBottom = '2px solid transparent';
        document.getElementById('dateFrom').value = '2022-01';
        document.getElementById('dateTo').value = '2026-07';
      }

      renderTable();
    }

    // 渲染表格
    function renderTable() {
      const tbody = document.getElementById('settlement-tbody');
      const thead = document.getElementById('table-header');
      const title = document.getElementById('table-title');
      const downloadBtn = document.getElementById('download-btn');

      const rows = currentTab === 'daily' ? allDailyRows : allMonthlyRows;
      title.textContent = currentTab === 'daily' ? '日报表' : '月报表';
      downloadBtn.style.display = currentTab === 'daily' ? 'flex' : 'none';

      // 更新表头
      if (currentTab === 'monthly') {
        thead.innerHTML = `
          <th>机构名称</th>
          <th>日期</th>
          <th>月报表</th>
          <th>结算笔数</th>
          <th>结算金额</th>
          <th>结算状态</th>
          <th>结算结果</th>
          <th>规则金额</th>
          <th>营销活动金额</th>
          <th>会员权益金额</th>
        `;
      } else {
        thead.innerHTML = `
          <th>机构名称</th>
          <th>日期</th>
          <th>结算笔数</th>
          <th>结算金额</th>
          <th>结算状态</th>
          <th>结算结果</th>
          <th>规则金额</th>
          <th>营销活动金额</th>
          <th>会员权益金额</th>
          <th>操作</th>
        `;
      }

      // 分页数据
      const pagedRows = rows.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

      if (pagedRows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${currentTab === 'daily' ? 10 : 10}" class="text-center text-muted-foreground" style="padding: 40px;">暂无数据</td></tr>`;
      } else {
        tbody.innerHTML = pagedRows.map(row => {
          if (currentTab === 'monthly') {
            return `
              <tr>
                <td>${row.org}</td>
                <td>${row.date}</td>
                <td style="color: #1677ff; cursor: pointer;" onclick="goToDailyDetail('${row.date}')">${row.reportName}</td>
                <td>${row.count}</td>
                <td>${row.amount}</td>
                <td><span style="color: #1677ff;">${row.status}</span></td>
                <td>${row.result}</td>
                <td>${row.pointFee}</td>
                <td>${row.marketFee}</td>
                <td>${row.memberFee}</td>
              </tr>
            `;
          } else {
            return `
              <tr>
                <td>${row.org}</td>
                <td>${row.date}</td>
                <td>${row.count}</td>
                <td>${row.amount}</td>
                <td><span style="color: #1677ff;">${row.status}</span></td>
                <td>${row.result}</td>
                <td>${row.pointFee}</td>
                <td>${row.marketFee}</td>
                <td>${row.memberFee}</td>
                <td>
                  <button class="mk-icon-btn" title="查看" onclick="goToDailyDetail('${row.date}')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1677ff" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                </td>
              </tr>
            `;
          }
        }).join('');
      }

      renderPagination(rows.length);
    }

    // 渲染分页
    function renderPagination(total) {
      const totalPages = Math.ceil(total / PAGE_SIZE);
      const pagination = document.getElementById('pagination');

      let html = `<span style="font-size: 13px; color: #8c95a6;">共 ${total} 条</span>`;

      if (totalPages > 1) {
        html += `<button class="mk-page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})" style="font-size: 12px;"><</button>`;

        for (let p = 1; p <= totalPages; p++) {
          html += `<button class="mk-page-btn${currentPage === p ? ' active' : ''}" onclick="changePage(${p})">${p}</button>`;
        }

        html += `<button class="mk-page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})" style="font-size: 12px;">></button>`;
      }

      pagination.innerHTML = html;
    }

    // 切换页码
    function changePage(page) {
      const rows = currentTab === 'daily' ? allDailyRows : allMonthlyRows;
      const totalPages = Math.ceil(rows.length / PAGE_SIZE);
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      renderTable();
    }

    // 跳转日报表明细
    function goToDailyDetail(date) {
      window.location.href = `reconcile-settlement-daily.html?date=${date}`;
    }

    // 下载
    function handleDownload() {
      const rows = allDailyRows;
      const headers = ['机构名称', '日期', '结算笔数', '结算金额', '结算状态', '结算结果', '规则金额', '营销活动金额', '会员权益金额'];
      const csvRows = rows.map(r => [r.org, r.date, r.count, r.amount, r.status, r.result, r.pointFee, r.marketFee, r.memberFee].join(','));
      const csv = [headers.join(','), ...csvRows].join('\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `日报表_${document.getElementById('dateFrom').value || '全部'}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // 查询
    function handleQuery() {
      currentPage = 1;
      renderTable();
    }

    // 重置
    function handleReset() {
      if (currentTab === 'daily') {
        document.getElementById('dateFrom').value = '2021-07-01';
        document.getElementById('dateTo').value = '2026-07-09';
      } else {
        document.getElementById('dateFrom').value = '2022-01';
        document.getElementById('dateTo').value = '2026-07';
      }
      document.getElementById('org').value = '请选择所属机构';
      currentPage = 1;
      renderTable();
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
      renderTable();
    });
  </script>
</body>
</html>
