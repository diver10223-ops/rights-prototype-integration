<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客户视图详情 - 权益平台管理系统</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .customer-detail-wrap { min-height: 100%; background: #f5f7fa; }
    .detail-backbar { background: #fff; border-bottom: 1px solid #e8ecf0; padding: 10px 24px; display: flex; align-items: center; gap: 8px; }
    .detail-content { padding: 0 24px 48px; }
    .detail-card { background: #fff; border: 1px solid #e8ecf0; border-radius: 8px; }
    .detail-card-title { padding: 16px 24px; border-bottom: 1px solid #e8ecf0; font-size: 14px; font-weight: 600; color: #1a1a2e; }
    .customer-info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 24px; padding: 20px 24px; }
    .info-item { font-size: 13px; color: #1a1a2e; }
    .info-item .label { color: #8c95a6; }
    .info-item .link { color: #1677ff; cursor: pointer; }
    .stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 16px 0; }
    .stat-card { background: #fff; border: 1px solid #e8ecf0; border-radius: 8px; padding: 20px 20px 16px; }
    .stat-card-header { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
    .stat-label { font-size: 13px; color: #8c95a6; }
    .stat-value { font-size: 20px; font-weight: 600; color: #1a1a2e; }
    .stat-badge { width: 16px; height: 16px; border-radius: 50%; background: #d9dee6; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; color: #666; }
    .coupon-table-wrap { padding: 16px 24px 20px; }
    .empty-state { text-align: center; color: #8c95a6; padding: 40px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- 顶栏 -->
      <header class="top-header">
        <div class="header-actions">
          <button class="header-icon-btn" title="通知">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          </button>
          <div class="header-user">
            <div class="user-avatar" style="width: 24px; height: 24px; font-size: 10px;">A</div>
            <span style="font-size: 13px;">管理员</span>
          </div>
        </div>
      </header>

      <!-- Tab栏 -->
      <div class="tab-bar" id="tab-bar"></div>

      <!-- 页面内容 -->
      <div class="page-content">
        <div class="customer-detail-wrap">
          <!-- 页面顶部：返回按钮 -->
          <div class="detail-backbar">
            <button onclick="goBack()" style="display: flex; align-items: center; gap: 4px; color: #1677ff; background: none; border: none; cursor: pointer; font-size: 14px; padding: 0;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
              返回客户列表
            </button>
            <span style="color: #d9dee6;">|</span>
            <span style="font-size: 14px; color: #333; font-weight: 500;">客户视图详情</span>
          </div>

          <div class="detail-content">
            <!-- 客户基本信息卡 -->
            <div class="detail-card" style="margin-bottom: 16px;">
              <div class="detail-card-title">客户基本信息</div>
              <div class="customer-info-grid" id="customerInfo">
                <!-- 动态生成 -->
              </div>
            </div>

            <!-- 统计卡片 -->
            <div class="stat-cards" id="statCards">
              <!-- 动态生成 -->
            </div>

            <!-- 持有卡券 -->
            <div class="detail-card">
              <div class="detail-card-title">持有卡券</div>
              <div class="coupon-table-wrap">
                <div class="overflow-x-auto">
                  <table class="mk-table">
                    <thead>
                      <tr>
                        <th>卡券名称</th>
                        <th>卡券类型</th>
                        <th>状态</th>
                        <th>采购成本（元）</th>
                        <th>发放时间</th>
                        <th>到期时间</th>
                      </tr>
                    </thead>
                    <tbody id="couponTable">
                      <!-- 动态生成 -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/nav.js"></script>
  <script>
    // Mock数据 - 客户卡券记录
    const CUSTOMER_COUPONS = {
      '100000000012': [
        { id: '1', name: '满100减20券', type: '满减券', status: '可用', issueTime: '2026-06-01', expiry: '2026-12-31', purchaseCost: 20 },
        { id: '2', name: '理财加息券', type: '抵扣券', status: '已使用', issueTime: '2026-05-01', expiry: '2026-09-30', purchaseCost: 20 },
        { id: '3', name: '爱奇艺季卡', type: '兑换券', status: '已过期', issueTime: '2026-03-10', expiry: '2026-06-09', purchaseCost: 28 },
      ],
      '100000000017': [
        { id: '4', name: '星巴克50元饮品券', type: '兑换券', status: '可用', issueTime: '2026-06-10', expiry: '2026-08-31', purchaseCost: 35 },
        { id: '5', name: '9折信用卡年费折扣', type: '折扣券', status: '已使用', issueTime: '2026-05-15', expiry: '2026-12-31', purchaseCost: 30 },
      ],
      '100000000574': [
        { id: '6', name: '京东E卡100元', type: '兑换券', status: '可用', issueTime: '2026-06-15', expiry: '2026-12-31', purchaseCost: 80 },
        { id: '7', name: '话费充值30元', type: '兑换券', status: '已使用', issueTime: '2026-04-01', expiry: '2026-07-01', purchaseCost: 25 },
      ],
      '100000000575': [
        { id: '8', name: '理财加息券', type: '抵扣券', status: '可用', issueTime: '2026-05-20', expiry: '2026-11-20', purchaseCost: 20 },
        { id: '9', name: '电影票双人套餐', type: '兑换券', status: '已过期', issueTime: '2026-03-01', expiry: '2026-05-31', purchaseCost: 60 },
        { id: '10', name: '满200减50券', type: '满减券', status: '可用', issueTime: '2026-06-01', expiry: '2026-09-01', purchaseCost: 40 },
      ],
      '100000000576': [
        { id: '11', name: '优酷VIP月卡', type: '兑换券', status: '可用', issueTime: '2026-07-01', expiry: '2026-08-01', purchaseCost: 15 },
      ],
      '100000000577': [
        { id: '12', name: '高铁延误险', type: '保险券', status: '已使用', issueTime: '2026-05-10', expiry: '2026-06-10', purchaseCost: 10 },
        { id: '13', name: '满100减20券', type: '满减券', status: '可用', issueTime: '2026-06-20', expiry: '2026-12-31', purchaseCost: 20 },
      ],
      '100000000578': [
        { id: '14', name: '滴滴打车券30元', type: '满减券', status: '可用', issueTime: '2026-06-25', expiry: '2026-09-25', purchaseCost: 25 },
        { id: '15', name: '爱奇艺季卡', type: '兑换券', status: '已使用', issueTime: '2026-04-15', expiry: '2026-07-15', purchaseCost: 28 },
      ],
    };

    // 客户信息
    const mockCustomers = {
      '100000000012': { name: '张明一', phone: '15952787303', userId: '100000000012', certType: '身份证', certNo: '410800199001016313', level: 'VIP3', source: '手机银行', org: '长春分行', branch: '吉林银行长春人民广场支行' },
      '100000000017': { name: '李华', phone: '13800138001', userId: '100000000017', certType: '身份证', certNo: '320100198506151234', level: 'VIP2', source: '手机银行', org: '南京分行', branch: '江苏银行新街口支行' },
      '100000000574': { name: '王芳', phone: '13912345678', userId: '100000000574', certType: '身份证', certNo: '310100199203085827', level: 'VIP1', source: '网上银行', org: '上海分行', branch: '上海浦东支行' },
      '100000000575': { name: '刘伟', phone: '15611112222', userId: '100000000575', certType: '身份证', certNo: '440100198807124517', level: 'VIP2', source: '手机银行', org: '广州分行', branch: '广州天河支行' },
      '100000000576': { name: '陈静', phone: '13722223333', userId: '100000000576', certType: '身份证', certNo: '330100199504231234', level: 'VIP1', source: '手机银行', org: '杭州分行', branch: '杭州银行滨江支行' },
      '100000000577': { name: '赵磊', phone: '18811114444', userId: '100000000577', certType: '身份证', certNo: '110100198612091357', level: 'VIP3', source: '柜台', org: '北京分行', branch: '北京朝阳支行' },
      '100000000578': { name: '孙丽', phone: '13600005555', userId: '100000000578', certType: '身份证', certNo: '350100199108156420', level: 'VIP2', source: '手机银行', org: '厦门分行', branch: '厦门湖里支行' },
    };

    // 计算统计数据
    function calcStats(records) {
      const total = records.length;
      const holding = records.filter(r => r.status === '可用').length;
      const used = records.filter(r => r.status === '已使用').length;
      const expired = records.filter(r => r.status === '已过期').length;
      const settleFund = records.filter(r => r.status === '已使用').reduce((sum, r) => sum + r.purchaseCost, 0);
      const relatedRevenue = Math.round(settleFund * 8.5);
      const roi = settleFund > 0 ? (relatedRevenue / settleFund).toFixed(2) : '—';
      return { total, holding, used, expired, settleFund, relatedRevenue, roi };
    }

    function goBack() {
      window.location.href = 'operation-customers.html';
    }

    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    function renderPage() {
      const userId = getQueryParam('userId');
      const customer = mockCustomers[userId];
      const couponRecords = CUSTOMER_COUPONS[userId] || [];

      if (!customer) {
        document.querySelector('.page-content').innerHTML = `
          <div style="min-height: 100vh; background: #f5f7fa;">
            <div style="background: #fff; border-bottom: 1px solid #e8ecf0; padding: 12px 24px; display: flex; align-items: center; gap: 12px;">
              <button onclick="goBack()" style="display: flex; align-items: center; gap: 4px; color: #1677ff; background: none; border: none; cursor: pointer; font-size: 14px; padding: 0;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                返回客户列表
              </button>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 300px; color: #8c95a6; font-size: 15px;">
              <div style="font-size: 40px; margin-bottom: 12px;">🔍</div>
              <div>未找到用户号为「${userId}」的客户信息</div>
            </div>
          </div>
        `;
        return;
      }

      const stats = calcStats(couponRecords);

      // 渲染客户基本信息
      document.getElementById('customerInfo').innerHTML = `
        <div class="info-item"><span class="label">客户姓名：</span>${customer.name}</div>
        <div class="info-item"><span class="label">手机号：</span>${customer.phone}</div>
        <div class="info-item"><span class="label">用户号：</span>${customer.userId}</div>
        <div class="info-item"><span class="label">证件类型：</span>${customer.certType}</div>
        <div class="info-item"><span class="label">证件号码：</span>${customer.certNo}</div>
        <div class="info-item"><span class="label">客户等级：</span>${customer.level}</div>
        <div class="info-item"><span class="label">客户来源：</span>${customer.source}</div>
        <div class="info-item"><span class="label">归属机构：</span><span class="link">${customer.org}</span></div>
        <div class="info-item"><span class="label">归属支行：</span>${customer.branch}</div>
      `;

      // 渲染统计卡片
      const statCards = [
        { label: '累计获得卡券', value: `${stats.total} 张`, badge: null },
        { label: '持有卡券', value: `${stats.holding} 张`, badge: null },
        { label: '结算资金', value: `${stats.settleFund} 元`, badge: null },
        { label: 'ROI', value: stats.roi, badge: '?' },
      ];

      document.getElementById('statCards').innerHTML = statCards.map(c => `
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-label">${c.label}</span>
            ${c.badge ? `<span class="stat-badge">${c.badge}</span>` : ''}
          </div>
          <div class="stat-value">${c.value}</div>
        </div>
      `).join('');

      // 渲染卡券表格
      const tbody = document.getElementById('couponTable');
      if (couponRecords.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-state">暂无数据</td></tr>';
      } else {
        tbody.innerHTML = couponRecords.map(r => `
          <tr>
            <td style="color: #1677ff;">${r.name}</td>
            <td>${r.type}</td>
            <td>
              <span style="
                color: ${r.status === '可用' ? '#52c41a' : r.status === '已使用' ? '#1677ff' : '#8c95a6'};
                font-weight: ${r.status === '可用' ? 500 : 'normal'};
              ">${r.status}</span>
            </td>
            <td>${r.purchaseCost.toFixed(2)}</td>
            <td style="color: #8c95a6;">${r.issueTime}</td>
            <td style="color: #8c95a6;">${r.expiry}</td>
          </tr>
        `).join('');
      }
    }

    document.addEventListener('DOMContentLoaded', renderPage);
  </script>
</body>
</html>
